<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare RAG Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="chat-wrapper">

    <div class="chat-container">

        <div class="chat-header">

            <div class="logo">
                🏥
            </div>

            <div>

                <h3>Healthcare RAG Assistant</h3>

                <p>Enterprise Medical Knowledge Chatbot</p>

            </div>

        </div>

        <div id="messageFormeight" class="chat-body">

        </div>

        <form id="messageArea" class="chat-footer">

            <input
                id="text"
                name="msg"
                type="text"
                placeholder="Ask a medical question..."
                autocomplete="off"
                required
            >

            <button type="submit">

                ➜

            </button>

        </form>

    </div>

</div>

<script>

document.getElementById("messageArea").addEventListener("submit", async function(e){

    e.preventDefault();

    const input=document.getElementById("text");

    const message=input.value.trim();

    if(message==="") return;

    appendMessage(message,"user");

    input.value="";

    appendMessage("Thinking...","bot","thinking");

    const response=await fetch("/get",{

        method:"POST",

        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },

        body:new URLSearchParams({
            msg:message
        })

    });

    const data=await response.text();

    document.querySelector(".thinking").remove();

    appendMessage(data,"bot");

});


function appendMessage(text,type,extra=""){

    const container=document.getElementById("messageFormeight");

    const div=document.createElement("div");

    div.className=`message ${type} ${extra}`;

    div.innerHTML=text;

    container.appendChild(div);

    container.scrollTop=container.scrollHeight;

}

</script>

</body>
</html>
